html &gt; body {

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))

b,

}

.table-responsive &gt; .table :is(th, td) {

  padding: 0 !important;
  border: 0 !important;

.btn,

.btn:not(:disabled):hover {

    ffn: [[512, 0.484], [8192, 1.788], [16384, 2.972902]],
    combine: [[512, 0.018196558], [8192, 0.017993303], [16384, 0.017245302]],
  };
  const presets = [512, 8192, 1024, 12288, 2048, 6144, 768, 16384];
  const lengths = presets.slice();
  let selectedJobKey = null;
  let lastSimulation = null;

  function svgNode(name, attrs = {}, text = &#x27;&#x27;) {
    const node = document.createElementNS(SVG_NS, name);
    Object.entries(attrs).forEach(([key, value]) =&gt; node.setAttribute(key, String(value)));
    if (text) node.textContent = text;
    return node;
  }

  function fmtTokens(value) {
    if (value &gt;= 1024) {
      const k = value / 1024;
      return `${k &gt;= 10 ? k.toFixed(0) : k.toFixed(1)}K`;
    }
    return String(value);
  }

  function requestObjects() {
    const count = Number(countInput.value);
    return Array.from({ length: count }, (_, index) =&gt; ({
      id: index + 1,
      length: lengths[index],
    }));
  }

  function assignRequests(requests, dpCount) {
    return requests.map((request, index) =&gt; ({ ...request, dp: index % dpCount }));
  }

  function interpolateProfile(points, tokens) {
    const upperIndex = points.findIndex(point =&gt; tokens &lt;= point[0]);
    const right = upperIndex &lt;= 0
      ? points[1]
      : upperIndex === -1 ? points[points.length - 1] : points[upperIndex];
    const left = upperIndex &lt;= 0
      ? points[0]
      : upperIndex === -1 ? points[points.length - 2] : points[upperIndex - 1];
    const ratio = (tokens - left[0]) / (right[0] - left[0]);
    return Math.max(0, left[1] + (right[1] - left[1]) * ratio);
  }

  function synchronousAttentionDuration(stage, attentionType, includeSetup) {
    const typeProfile = SYNCHRONOUS_PROFILE.attention[attentionType];
    return stage.parts.reduce((sum, part) =&gt; (
      sum
      + interpolateProfile(typeProfile.layer, part.tokens)
      + (includeSetup ? interpolateProfile(typeProfile.setup, part.tokens) : 0)
    ), 0);
  }

  function synchronousMoeDurations(dpStages) {
    const effectiveTokens = Math.max(...dpStages.map(stage =&gt; stage.tokens));
    return {
      effectiveTokens,
      dispatch: interpolateProfile(SYNCHRONOUS_PROFILE.dispatch, effectiveTokens),
      ffn: interpolateProfile(SYNCHRONOUS_PROFILE.ffn, effectiveTokens),
      combine: interpolateProfile(SYNCHRONOUS_PROFILE.combine, effectiveTokens),
    };
  }

  function requestStageCost(parts) {
    return parts.reduce((sum, part) =&gt; sum + part.tokens * part.tokens, 0);
  }

  function makeRequestStages(requests) {
    if (requests.length &lt; 2) {
      return [{
        index: 0,
        tokens: requests.reduce((sum, request) =&gt; sum + request.length, 0),
        parts: requests.map(request =&gt; ({ id: request.id, tokens: request.length, full: true })),
      }];
    }
    const total = requests.reduce((sum, request) =&gt; sum + request.length, 0);
    let prefix = 0;
    let bestIndex = 1;
    let bestDistance = Infinity;
    for (let index = 1; index &lt; requests.length; index += 1) {
      prefix += requests[index - 1].length;
      const distance = Math.abs(prefix * 2 - total);
      if (distance &lt; bestDistance) {
        bestDistance = distance;
        bestIndex = index;
      }
    }
    return [requests.slice(0, bestIndex), requests.slice(bestIndex)].map((group, index) =&gt; ({
      index,
      tokens: group.reduce((sum, request) =&gt; sum + request.length, 0),
      parts: group.map(request =&gt; ({ id: request.id, tokens: request.length, full: true })),
    }));
  }

  function partsForTokenRange(requests, start, stop) {
    const parts = [];
    let cursor = 0;
    requests.forEach(request =&gt; {
      const requestStart = cursor;
      const requestStop = cursor + request.length;
      const overlapStart = Math.max(start, requestStart);
      const overlapStop = Math.min(stop, requestStop);
      if (overlapStop &gt; overlapStart) {
        const tokens = overlapStop - overlapStart;
        parts.push({ id: request.id, tokens, full: tokens === request.length });
      }
      cursor = requestStop;
    });
    return parts;
  }

  function makeTokenStages(requests) {
    const total = requests.reduce((sum, request) =&gt; sum + request.length, 0);
    if (total &lt; 2) return makeRequestStages(requests);
    const split = Math.ceil(total / 2);
    return [[0, split], [split, total]].map(([start, stop], index) =&gt; ({
      index,
      tokens: stop - start,
      parts: partsForTokenRange(requests, start, stop),
    }));
  }

  function buildStages(requests) {
    const stages = splitInput.value === &#x27;token&#x27;
      ? makeTokenStages(requests)
      : makeRequestStages(requests);
    stages.forEach(stage =&gt; {
      stage.attentionCost = requestStageCost(stage.parts);
      stage.requestLabel = stage.parts.map(part =&gt; `R${part.id}${part.full ? &#x27;&#x27; : &#x27;*&#x27;}`).join(&#x27; + &#x27;);
    });
    return stages;
  }

  function attnDuration(stage, attentionType, includeSetup) {
    return synchronousAttentionDuration(stage, attentionType, includeSetup);
  }

  function dispatchDuration(stage) {
    return 0.11 + stage.tokens / 52000;
  }

  function recvDuration(stage) {
    return 0.10 + stage.tokens / 68000;
  }

  function ffnDuration(stage) {
    return interpolateProfile(SYNCHRONOUS_PROFILE.ffn, stage.tokens);
  }

  function sendDuration(stage) {
    return 0.10 + stage.tokens / 70000;
  }

  function combineDuration(stage) {
    return 0.12 + stage.tokens / 58000;
  }

  function op(type, stage, layer) {
    return { type, stage, layer, jobKey: `DPPENDING-U${stage}-L${layer}` };
  }

  function buildDpOps(stageCount) {
    const layerCount = Number(layerInput.value);
    if (stageCount === 1) {
      const ops = [];
      for (let layer = 0; layer &lt; layerCount; layer += 1) {
        ops.push(op(&#x27;attn&#x27;, 0, layer), op(&#x27;dispatch&#x27;, 0, layer), op(&#x27;combine&#x27;, 0, layer));
      }
      return ops;
    }

    const ops = [op(&#x27;attn&#x27;, 0, 0), op(&#x27;dispatch&#x27;, 0, 0)];
    for (let layer = 0; layer &lt; layerCount - 1; layer += 1) {
      ops.push(
        op(&#x27;attn&#x27;, 1, layer),
        op(&#x27;combine&#x27;, 0, layer),
        op(&#x27;dispatch&#x27;, 1, layer),
        op(&#x27;attn&#x27;, 0, layer + 1),
        op(&#x27;combine&#x27;, 1, layer),
        op(&#x27;dispatch&#x27;, 0, layer + 1),
      );
    }
    const lastLayer = layerCount - 1;
    ops.push(
      op(&#x27;attn&#x27;, 1, lastLayer),
      op(&#x27;combine&#x27;, 0, lastLayer),
      op(&#x27;dispatch&#x27;, 1, lastLayer),
      op(&#x27;combine&#x27;, 1, lastLayer),
    );
    return ops;
  }

  function simulate() {
    const requests = assignRequests(requestObjects(), TOPOLOGIES.async.dp);
    const dpStages = Array.from({ length: TOPOLOGIES.async.dp }, (_, dp) =&gt; (
      buildStages(requests.filter(request =&gt; request.dp === dp))
    ));
    const states = Array.from({ length: TOPOLOGIES.async.dp }, (_, dp) =&gt; ({
      dp,
      stages: dpStages[dp],
      ops: buildDpOps(dpStages[dp].length).map(item =&gt; ({
        ...item,
        jobKey: `DP${dp}-U${item.stage}-L${item.layer}`,
      })),
      index: 0,
      time: dp * 0.08,
    }));
    const jobs = new Map();
    const attentionSegments = [];
    const ffnSegments = [];
    let ffnAvailable = 0;
    let ffnBusy = 0;
    let totalAttentionWait = 0;

    while (states.some(state =&gt; state.index &lt; state.ops.length)) {
      const candidates = states
        .filter(state =&gt; state.index &lt; state.ops.length)
        .map(state =&gt; {
          const next = state.ops[state.index];
          let ready = state.time;
          if (next.type === &#x27;combine&#x27;) {
            const job = jobs.get(next.jobKey);
            if (!job) throw new Error(`Missing FFN job ${next.jobKey}`);
            ready = Math.max(ready, job.end);
          }
          return { state, next, ready };
        })
        .sort((a, b) =&gt; a.ready - b.ready || a.state.dp - b.state.dp);

      const { state, next } = candidates[0];
      const stage = state.stages[next.stage];
      if (next.type === &#x27;attn&#x27;) {
        const attentionType = MODEL_ATTENTION_SCHEDULE[next.layer];
        const includeAttentionSetup = MODEL_ATTENTION_SCHEDULE.indexOf(attentionType) === next.layer;
        const start = state.time;
        const end = start + attnDuration(stage, attentionType, includeAttentionSetup);
        attentionSegments.push({
          ...next,
          dp: state.dp,
          start,
          end,
          stageData: stage,
          attentionType,
          includeAttentionSetup,
        });
        state.time = end;
      } else if (next.type === &#x27;dispatch&#x27;) {
        const start = state.time;
        const end = start + dispatchDuration(stage);
        attentionSegments.push({ ...next, dp: state.dp, start, end, stageData: stage });

        const recvStart = Math.max(ffnAvailable, end);
        const recvEnd = recvStart + recvDuration(stage);
        const computeEnd = recvEnd + ffnDuration(stage);
        const sendEnd = computeEnd + sendDuration(stage);
        const job = {
          key: next.jobKey,
          dp: state.dp,
          stage: next.stage,
          layer: next.layer,
          stageData: stage,
          dispatchStart: start,
          dispatchEnd: end,
          recvStart,
          recvEnd,
          computeEnd,
          end: sendEnd,
        };
        jobs.set(next.jobKey, job);
        ffnSegments.push(
          { ...job, type: &#x27;recv&#x27;, jobKey: next.jobKey, start: recvStart, end: recvEnd },
          { ...job, type: &#x27;ffn&#x27;, jobKey: next.jobKey, start: recvEnd, end: computeEnd },
          { ...job, type: &#x27;send&#x27;, jobKey: next.jobKey, start: computeEnd, end: sendEnd },
        );
        ffnBusy += sendEnd - recvStart;
        ffnAvailable = sendEnd;
        state.time = end;
      } else {
        const job = jobs.get(next.jobKey);
        if (job.end &gt; state.time) {
          attentionSegments.push({
            type: &#x27;wait&#x27;,
            jobKey: next.jobKey,
            dp: state.dp,
            stage: next.stage,
            layer: next.layer,
            start: state.time,
            end: job.end,
            stageData: stage,
          });
          totalAttentionWait += job.end - state.time;
          state.time = job.end;
        }
        const start = state.time;
        const end = start + combineDuration(stage);
        attentionSegments.push({ ...next, dp: state.dp, start, end, stageData: stage });
        job.combineStart = start;
        job.combineEnd = end;
        state.time = end;
      }
      state.index += 1;
    }

    const makespan = Math.max(ffnAvailable, ...states.map(state =&gt; state.time));
    const simulation = {
      requests,
      dpStages,
      jobs,
      attentionSegments,
      ffnSegments,
      makespan,
      ffnBusy,
      totalAttentionWait,
    };
    updateRequestAssignments(simulation);
    return simulation;
  }

  function makeFullStage(requests, index = 0) {
    const parts = requests.map(request =&gt; ({
      id: request.id,
      tokens: request.length,
      full: true,
    }));
    return {
      index,
      parts,
      tokens: parts.reduce((sum, part) =&gt; sum + part.tokens, 0),
      attentionCost: requestStageCost(parts),
      requestLabel: parts.length ? parts.map(part =&gt; `R${part.id}`).join(&#x27; + &#x27;) : &#x27;无请求&#x27;,
    };
  }

  function simulateSynchronous(requests) {
    const synchronousRequests = assignRequests(requests, TOPOLOGIES.synchronous.dp);
    const dpStages = Array.from({ length: TOPOLOGIES.synchronous.dp }, (_, dp) =&gt; makeFullStage(
      synchronousRequests.filter(request =&gt; request.dp === dp),
    ));
    const globalStage = makeFullStage(synchronousRequests);
    const moeDurations = synchronousMoeDurations(dpStages);
    const segments = [];
    const layerCount = Number(layerInput.value);
    let layerStart = 0;
    let totalBarrierWait = 0;

    for (let layer = 0; layer &lt; layerCount; layer += 1) {
      const attentionType = MODEL_ATTENTION_SCHEDULE[layer];
      const includeAttentionSetup = MODEL_ATTENTION_SCHEDULE.indexOf(attentionType) === layer;
      const attentionEnds = dpStages.map((stage, dp) =&gt; {
        if (!stage.parts.length) return null;
        const end = layerStart + synchronousAttentionDuration(stage, attentionType, includeAttentionSetup);
        segments.push({
          type: &#x27;attn&#x27;, attentionType, includeAttentionSetup, layer, stage: 0, start: layerStart, end,
          lanes: Array.from({ length: TOPOLOGIES.synchronous.tp }, (_, tp) =&gt; (
            dp * TOPOLOGIES.synchronous.tp + tp
          )),
          stageData: stage,
        });
        return end;
      });
      const activeAttentionEnds = attentionEnds.filter(end =&gt; end !== null);
      const barrierEnd = Math.max(layerStart, ...activeAttentionEnds);
      attentionEnds.forEach((end, dp) =&gt; {
        const barrierStart = end === null ? layerStart : end;
        if (barrierStart &lt; barrierEnd) {
          segments.push({
            type: &#x27;barrier&#x27;, layer, stage: 0, start: barrierStart, end: barrierEnd,
            lanes: Array.from({ length: TOPOLOGIES.synchronous.tp }, (_, tp) =&gt; (
              dp * TOPOLOGIES.synchronous.tp + tp
            )),
            stageData: dpStages[dp],
          });
          if (end !== null) totalBarrierWait += barrierEnd - end;
        }
      });

      const dispatchStart = barrierEnd;
      const dispatchEnd = dispatchStart + moeDurations.dispatch;
      const ffnEnd = dispatchEnd + moeDurations.ffn;
      const combineEnd = ffnEnd + moeDurations.combine;
      const allRankLanes = Array.from({ length: TOPOLOGIES.synchronous.ep }, (_, rank) =&gt; rank);
      segments.push(
        {
          type: &#x27;dispatch&#x27;, layer, stage: 0, start: dispatchStart, end: dispatchEnd,
          lanes: allRankLanes, stageData: globalStage,
        },
        {
          type: &#x27;ffn&#x27;, layer, stage: 0, start: dispatchEnd, end: ffnEnd,
          lanes: allRankLanes, stageData: globalStage,
        },
        {
          type: &#x27;combine&#x27;, layer, stage: 0, start: ffnEnd, end: combineEnd,
          lanes: allRankLanes, stageData: globalStage,
        },
      );
      layerStart = combineEnd;
    }

    return {
      segments,
      makespan: layerStart,
      totalBarrierWait,
      layerCount,
      layerTypeCounts: MODEL_ATTENTION_SCHEDULE.slice(0, layerCount).reduce((counts, type) =&gt; {
        counts[type] += 1;
        return counts;
      }, { SWA: 0, CSA: 0, HCA: 0 }),
      activeDpCount: dpStages.filter(stage =&gt; stage.parts.length).length,
      effectiveTokens: moeDurations.effectiveTokens,
      fitOutOfRange: moeDurations.effectiveTokens &lt; PROFILE_TOKEN_MIN
        || moeDurations.effectiveTokens &gt; PROFILE_TOKEN_MAX
        || globalStage.parts.some(part =&gt; (
          part.tokens &lt; PROFILE_TOKEN_MIN || part.tokens &gt; PROFILE_TOKEN_MAX
        )),
    };
  }

  function updateRequestAssignments(simulation) {
    const assignments = new Map();
    simulation.dpStages.forEach((stages, dp) =&gt; {
      stages.forEach(stage =&gt; {
        stage.parts.forEach(part =&gt; {
          const label = `DP${dp}·U${stage.index}${part.full ? &#x27;&#x27; : &#x27;·partial&#x27;}`;
          const current = assignments.get(part.id) || [];
          current.push(label);
          assignments.set(part.id, current);
        });
      });
    });
    editor.querySelectorAll(&#x27;[data-request-map]&#x27;).forEach(node =&gt; {
      const id = Number(node.getAttribute(&#x27;data-request-map&#x27;));
      const asyncLabel = (assignments.get(id) || []).join(&#x27; / &#x27;);
      const synchronousDp = (id - 1) % TOPOLOGIES.synchronous.dp;
      node.textContent = `AF 分离 ${asyncLabel} · 大 EP DP${synchronousDp}`;
    });
  }

  function updateSplitStatus(simulation) {
    const states = simulation.dpStages.map((stages, dp) =&gt; {
      if (stages.length &gt; 1) return `DP${dp}: U0/U1`;
      return `DP${dp}: 仅 U0（回退单 batch）`;
    });
    const hasFallback = simulation.dpStages.some(stages =&gt; stages.length === 1);
    if (splitInput.value === &#x27;request&#x27; &amp;&amp; hasFallback) {
      splitStatus.textContent = `ubatch 状态 · ${states.join(&#x27;；&#x27;)}。请求边界切分要求同一 DP 至少有 2 个请求；可将全局请求增至 4 个，或改用 Token 均衡。`;
      return;
    }
    splitStatus.textContent = `ubatch 状态 · ${states.join(&#x27;；&#x27;)}`;
  }

  function buildRequestEditor() {
    const count = Number(countInput.value);
    countValue.textContent = String(count);
    editor.replaceChildren();
    for (let index = 0; index &lt; count; index += 1) {
      const label = document.createElement(&#x27;label&#x27;);
      label.className = &#x27;form-label apv-request-control&#x27;;
      label.setAttribute(&#x27;for&#x27;, `apv-length-${index}`);

      const heading = document.createElement(&#x27;span&#x27;);
      heading.className = &#x27;apv-request-heading&#x27;;
      const name = document.createElement(&#x27;span&#x27;);
      name.textContent = `R${index + 1} · ${fmtTokens(lengths[index])} tokens`;
      name.setAttribute(&#x27;data-request-length-label&#x27;, String(index));
      const mapping = document.createElement(&#x27;span&#x27;);
      mapping.className = &#x27;text-small text-muted&#x27;;
      mapping.setAttribute(&#x27;data-request-map&#x27;, String(index + 1));
      heading.append(name, mapping);

      const input = document.createElement(&#x27;input&#x27;);
      input.id = `apv-length-${index}`;
      input.className = &#x27;form-range&#x27;;
      input.type = &#x27;range&#x27;;
      input.min = &#x27;128&#x27;;
      input.max = &#x27;16384&#x27;;
      input.step = &#x27;128&#x27;;
      input.value = String(lengths[index]);
      input.addEventListener(&#x27;input&#x27;, () =&gt; {
        lengths[index] = Number(input.value);
        name.textContent = `R${index + 1} · ${fmtTokens(lengths[index])} tokens`;
        render();
      });
      label.append(heading, input);
      editor.append(label);
    }
  }

  function segmentLabel(segment, widthPx) {
    if (widthPx &lt; 17) return &#x27;&#x27;;
    if (segment.type === &#x27;wait&#x27;) return widthPx &gt; 34 ? &#x27;wait&#x27; : &#x27;&#x27;;
    if (segment.type === &#x27;barrier&#x27;) return widthPx &gt; 46 ? &#x27;barrier&#x27; : &#x27;B&#x27;;
    if (segment.type === &#x27;dispatch&#x27;) return widthPx &gt; 26 ? &#x27;D&#x27; : &#x27;&#x27;;
    if (segment.type === &#x27;combine&#x27;) return widthPx &gt; 26 ? &#x27;C&#x27; : &#x27;&#x27;;
    if (segment.type === &#x27;recv&#x27;) return widthPx &gt; 24 ? &#x27;R&#x27; : &#x27;&#x27;;
    if (segment.type === &#x27;send&#x27;) return widthPx &gt; 24 ? &#x27;S&#x27; : &#x27;&#x27;;
    if (segment.type === &#x27;attn&#x27; &amp;&amp; segment.attentionType) {
      return widthPx &gt; 58 ? `${segment.attentionType} L${segment.layer}` : widthPx &gt; 34 ? segment.attentionType : &#x27;A&#x27;;
    }
    if (segment.type === &#x27;attn&#x27;) return widthPx &gt; 58 ? `A L${segment.layer}·U${segment.stage}` : &#x27;A&#x27;;
    if (segment.type === &#x27;ffn&#x27;) return widthPx &gt; 58 ? `F L${segment.layer}·U${segment.stage}` : &#x27;F&#x27;;
    return &#x27;&#x27;;
  }

  function tooltipFor(segment, resource) {
    const stage = segment.stageData;
    const phaseNames = {
      attn: &#x27;Attention&#x27;, dispatch: &#x27;A→F dispatch&#x27;, wait: &#x27;等待 FFN&#x27;, barrier: &#x27;全局同步屏障&#x27;,
      combine: &#x27;F→A combine&#x27;, recv: &#x27;dispatch recv&#x27;, ffn: &#x27;FFN experts&#x27;, send: &#x27;combine send&#x27;,
    };
    const phaseName = segment.type === &#x27;attn&#x27; &amp;&amp; segment.attentionType
      ? `${segment.attentionType} Attention`
      : phaseNames[segment.type];
    return `${resource} · ${phaseName} · L${segment.layer} U${segment.stage} · ${stage.requestLabel} · ${fmtTokens(stage.tokens)} tokens · ${(segment.end - segment.start).toFixed(2)} ms`;
  }

  function renderSynchronous(simulation, width, zoom, panFraction) {
    const laneStep = 26;
    const groupGap = 10;
    const laneYs = Array.from({ length: TOPOLOGIES.synchronous.ep }, (_, rank) =&gt; (
      38 + rank * laneStep + Math.floor(rank / TOPOLOGIES.synchronous.tp) * groupGap
    ));
    const laneLabels = Array.from({ length: TOPOLOGIES.synchronous.ep }, (_, rank) =&gt; [
      `AF-EP${rank}`,
      `DP${Math.floor(rank / TOPOLOGIES.synchronous.tp)}/TP${rank % TOPOLOGIES.synchronous.tp}`,
    ]);
    const height = laneYs[laneYs.length - 1] + 64;
    const margin = { left: width &lt; 430 ? 92 : 116, right: 16, top: 28, bottom: 34 };
    const plotWidth = Math.max(166, width - margin.left - margin.right);
    const plotTop = margin.top;
    const plotBottom = height - margin.bottom;
    const barHeight = 18;
    const visibleSpan = simulation.makespan / zoom;
    const windowStart = (simulation.makespan - visibleSpan) * panFraction;
    const windowEnd = windowStart + visibleSpan;
    const x = time =&gt; margin.left + ((time - windowStart) / visibleSpan) * plotWidth;

    const fitLabel = simulation.fitOutOfRange ? &#x27;含 P/Q 实测域外推&#x27; : &#x27;P/Q 实测域内拟合&#x27;;
    const typeCounts = simulation.layerTypeCounts;
    syncStatus.textContent = `总跨度 ${simulation.makespan.toFixed(1)} ms · 前 ${simulation.layerCount} 层：SWA ${typeCounts.SWA} / CSA ${typeCounts.CSA} / HCA ${typeCounts.HCA} · ${simulation.activeDpCount}/4 DP 活跃 · DP 同步等待 ${simulation.totalBarrierWait.toFixed(1)} ms · 慢 DP q ${fmtTokens(simulation.effectiveTokens)} · ${fitLabel} · 全局 EP16`;
    syncSvg.replaceChildren();
    syncSvg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`);
    syncSvg.setAttribute(&#x27;height&#x27;, String(height));
    syncSvg.append(
      svgNode(&#x27;title&#x27;, { id: &#x27;apv-sync-svg-title&#x27; }, &#x27;同步大 EP AF 合并时间线&#x27;),
      svgNode(&#x27;desc&#x27;, { id: &#x27;apv-sync-svg-desc&#x27; }, `十六条 AF rank 泳道展示 DP4×TP4、EP16 上前 ${simulation.layerCount} 个真实模型层的 SWA、CSA、HCA Attention、全局同步屏障和 FFN。`),
    );

    const defs = svgNode(&#x27;defs&#x27;);
    const clipPath = svgNode(&#x27;clipPath&#x27;, { id: &#x27;apv-sync-plot-clip&#x27; });
    clipPath.append(svgNode(&#x27;rect&#x27;, {
      x: margin.left, y: plotTop, width: plotWidth, height: plotBottom - plotTop,
    }));
    defs.append(clipPath);
    syncSvg.append(defs);

    laneYs.forEach((laneY, index) =&gt; {

        }));
      }
      const label = svgNode(&#x27;text&#x27;, {

      label.append(svgNode(&#x27;tspan&#x27;, {
        x: margin.left - 8, dy: 12, class: &#x27;apv-axis-text&#x27;,
      }, laneLabels[index][1]));
      syncSvg.append(label);
    });
    for (let dp = 1; dp &lt; TOPOLOGIES.synchronous.dp; dp += 1) {
      const previousLane = dp * TOPOLOGIES.synchronous.tp - 1;
      const nextLane = dp * TOPOLOGIES.synchronous.tp;
      const separatorY = (laneYs[previousLane] + laneYs[nextLane]) / 2 + 10;
      syncSvg.append(svgNode(&#x27;line&#x27;, {
        class: &#x27;apv-separator&#x27;, x1: margin.left, x2: margin.left + plotWidth,

    const tickCount = width &lt; 480 ? 4 : 6;
    for (let tick = 0; tick &lt;= tickCount; tick += 1) {

      const tickX = x(time);
      syncSvg.append(svgNode(&#x27;line&#x27;, {
        class: &#x27;apv-grid-line&#x27;, x1: tickX, x2: tickX, y1: plotTop, y2: plotBottom,
      }));
      syncSvg.append(svgNode(&#x27;text&#x27;, {
        class: &#x27;apv-axis-text&#x27;, x: tickX, y: plotBottom + 18,
        &#x27;text-anchor&#x27;: tick === 0 ? &#x27;start&#x27; : tick === tickCount ? &#x27;end&#x27; : &#x27;middle&#x27;,
      }, `${time.toFixed(0)} ms`));
    }
    syncSvg.append(svgNode(&#x27;rect&#x27;, {
      class: &#x27;apv-frame&#x27;, &#x27;data-chart-frame&#x27;: &#x27;&#x27;, x: margin.left, y: plotTop,
      width: plotWidth, height: plotBottom - plotTop,
    }));
    syncSvg.append(svgNode(&#x27;text&#x27;, {
      class: &#x27;apv-axis-title&#x27;, &#x27;data-axis&#x27;: &#x27;x&#x27;, x: margin.left + plotWidth / 2,
      y: height - 3, &#x27;text-anchor&#x27;: &#x27;middle&#x27;,
    }, &#x27;相对时间（ms）&#x27;));

    const barLayer = svgNode(&#x27;g&#x27;, { &#x27;clip-path&#x27;: &#x27;url(#apv-sync-plot-clip)&#x27; });
    syncSvg.append(barLayer);
    simulation.segments.forEach(segment =&gt; {
      if (segment.end &lt;= windowStart || segment.start &gt;= windowEnd) return;
      const startX = x(Math.max(segment.start, windowStart));
      const endX = x(Math.min(segment.end, windowEnd));
      const rectWidth = Math.max(1.5, endX - startX);
      segment.lanes.forEach(laneIndex =&gt; {
        const y = laneYs[laneIndex] + 2;
        const resource = `${laneLabels[laneIndex][0]} ${laneLabels[laneIndex][1]}`;
        const phaseTooltip = segment.type === &#x27;barrier&#x27;
          ? &#x27;全局同步屏障&#x27;
          : tooltipFor(segment, resource).split(&#x27; · &#x27;).slice(1).join(&#x27; · &#x27;);
        const fitTooltip = [&#x27;dispatch&#x27;, &#x27;ffn&#x27;, &#x27;combine&#x27;].includes(segment.type)
          ? ` · profiling 拟合输入：慢 DP q ${fmtTokens(simulation.effectiveTokens)} · 锚点：${[&#x27;dispatch&#x27;, &#x27;combine&#x27;].includes(segment.type) ? &#x27;16-rank 中位数&#x27; : &#x27;原 FFN 口径&#x27;}`
          : segment.type === &#x27;attn&#x27;
            ? ` · profiling 拟合输入：${segment.attentionType} / 每请求长度${segment.includeAttentionSetup ? &#x27; / 含首次 Metadata setup&#x27; : &#x27;&#x27;}`
            : &#x27;&#x27;;
        const attentionClass = segment.type === &#x27;attn&#x27; &amp;&amp; segment.attentionType
          ? ` apv-segment-attn-${segment.attentionType.toLowerCase()}`
          : &#x27;&#x27;;
        barLayer.append(svgNode(&#x27;rect&#x27;, {
          class: `apv-segment apv-segment-${segment.type}${attentionClass}`,
          x: startX, y, width: rectWidth, height: barHeight, rx: 2,
          &#x27;data-tooltip&#x27;: `${resource} · ${phaseTooltip}${fitTooltip}`,
        }));
        const label = segmentLabel(segment, rectWidth);
        if (label) {
          const syncLabel = segment.type === &#x27;attn&#x27; &amp;&amp; rectWidth &gt; 58
            ? `${segment.attentionType} L${segment.layer}`
            : segment.type === &#x27;ffn&#x27; &amp;&amp; rectWidth &gt; 58
              ? `F L${segment.layer}`
              : label;
          barLayer.append(svgNode(&#x27;text&#x27;, {
            class: &#x27;apv-bar-label&#x27;, x: startX + rectWidth / 2, y: y + 13,
            &#x27;text-anchor&#x27;: &#x27;middle&#x27;,
          }, syncLabel));
        }
      });
    });
  }

  function render() {
    const simulation = simulate();
    const synchronousSimulation = simulateSynchronous(simulation.requests);
    lastSimulation = simulation;
    updateSplitStatus(simulation);
    const layerCount = Number(layerInput.value);
    layerValue.textContent = String(layerCount);
    layerLegend.textContent = `U0 实色 · U1 半透明 · 前 ${layerCount} 个模型层`;
    const jobKeys = Array.from(simulation.jobs.keys());
    if (!selectedJobKey || !simulation.jobs.has(selectedJobKey)) selectedJobKey = jobKeys[0] || null;

    makespanText.textContent = `总跨度 ${simulation.makespan.toFixed(1)} ms`;
    ffnUtilText.textContent = `FFN 利用率 ${Math.round(simulation.ffnBusy / simulation.makespan * 100)}%`;
    attnWaitText.textContent = `Attention 等待 ${simulation.totalAttentionWait.toFixed(1)} ms`;

    const measuredWidth = Math.max(320, Math.floor(chartWrap.getBoundingClientRect().width || 736));
    const width = measuredWidth;
    const laneStep = 26;
    const groupGap = 10;
    const attentionLaneCount = TOPOLOGIES.async.dp * TOPOLOGIES.async.tp;
    const totalLaneCount = attentionLaneCount + TOPOLOGIES.async.ep;
    const laneYs = Array.from({ length: totalLaneCount }, (_, index) =&gt; (
      38
      + index * laneStep
      + (index &gt;= TOPOLOGIES.async.tp ? groupGap : 0)
      + (index &gt;= attentionLaneCount ? groupGap : 0)
    ));
    const laneLabels = Array.from({ length: totalLaneCount }, (_, index) =&gt; (
      index &lt; attentionLaneCount
        ? [`A-DP${Math.floor(index / TOPOLOGIES.async.tp)}`, `TP${index % TOPOLOGIES.async.tp}`]
        : [&#x27;FFN&#x27;, `EP${index - attentionLaneCount}`]
    ));
    const height = laneYs[laneYs.length - 1] + 64;
    const margin = { left: width &lt; 430 ? 86 : 106, right: 16, top: 34, bottom: 34 };
    const plotWidth = Math.max(170, width - margin.left - margin.right);
    const plotTop = margin.top;
    const plotBottom = height - margin.bottom;
    const laneHeight = 26;
    const barHeight = 18;
    const zoom = Number(zoomInput.value);
    const visibleSpan = simulation.makespan / zoom;
    const panFraction = Number(panInput.value) / 100;
    const windowStart = (simulation.makespan - visibleSpan) * panFraction;
    const windowEnd = windowStart + visibleSpan;
    const x = time =&gt; margin.left + ((time - windowStart) / visibleSpan) * plotWidth;
    const selectedInWindow = selectedJobKey ? simulation.jobs.get(selectedJobKey) : null;
    if (
      !selectedInWindow
      || (selectedInWindow.combineEnd ?? selectedInWindow.end) &lt;= windowStart
      || selectedInWindow.dispatchStart &gt;= windowEnd
    ) {
      selectedJobKey = jobKeys.find(key =&gt; {
        const job = simulation.jobs.get(key);
        return (job.combineEnd ?? job.end) &gt; windowStart &amp;&amp; job.dispatchStart &lt; windowEnd;
      }) || jobKeys[0] || null;
    }
    zoomValue.textContent = `${zoom.toFixed(2).replace(/0$/, &#x27;&#x27;)}×`;
    panInput.disabled = zoom === 1;
    panValue.textContent = zoom === 1
      ? &#x27;全时段&#x27;
      : `${windowStart.toFixed(1)}–${windowEnd.toFixed(1)} ms`;

    svg.replaceChildren();
    svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`);
    svg.setAttribute(&#x27;height&#x27;, String(height));

    const title = svgNode(&#x27;title&#x27;, { id: &#x27;apv-svg-title&#x27; }, &#x27;Attention DP2TP4 与 FFN EP8 的异步 CAM 单流时间线&#x27;);
    const desc = svgNode(&#x27;desc&#x27;, { id: &#x27;apv-svg-desc&#x27; }, `十六条资源泳道展示 ${simulation.requests.length} 个请求在 Attention DP2×TP4 和 FFN EP8 上的 ${layerCount} 层流水。`);
    svg.append(title, desc);

    const defs = svgNode(&#x27;defs&#x27;);
    const marker = svgNode(&#x27;marker&#x27;, {
      id: &#x27;apv-arrow&#x27;, markerWidth: 7, markerHeight: 7, refX: 6, refY: 3.5,
      orient: &#x27;auto&#x27;, markerUnits: &#x27;strokeWidth&#x27;,
    });
    marker.append(svgNode(&#x27;path&#x27;, { d: &#x27;M0,0 L7,3.5 L0,7 Z&#x27;, fill: &#x27;var(--foreground)&#x27; }));
    defs.append(marker);
    const clipPath = svgNode(&#x27;clipPath&#x27;, { id: &#x27;apv-plot-clip&#x27; });
    clipPath.append(svgNode(&#x27;rect&#x27;, {
      x: margin.left, y: plotTop, width: plotWidth, height: plotBottom - plotTop,
    }));
    defs.append(clipPath);
    svg.append(defs);

    laneYs.forEach((laneY, index) =&gt; {
      if (index % 2 === 1) {
        svg.append(svgNode(&#x27;rect&#x27;, {
          class: &#x27;apv-lane-band&#x27;, x: margin.left, y: laneY - 3,
          width: plotWidth, height: laneHeight - 2,
        }));
      }
      const label = svgNode(&#x27;text&#x27;, {
        class: &#x27;apv-lane-label&#x27;, x: margin.left - 8, y: laneY + 9, &#x27;text-anchor&#x27;: &#x27;end&#x27;,
      });
      label.append(svgNode(&#x27;tspan&#x27;, {}, laneLabels[index][0]));
      label.append(svgNode(&#x27;tspan&#x27;, { x: margin.left - 8, dy: 12, class: &#x27;apv-axis-text&#x27; }, laneLabels[index][1]));
      svg.append(label);
    });

    [TOPOLOGIES.async.tp, attentionLaneCount].forEach(boundary =&gt; {
      const separatorY = (laneYs[boundary - 1] + laneYs[boundary]) / 2 + 10;
      svg.append(svgNode(&#x27;line&#x27;, {
        class: &#x27;apv-separator&#x27;, x1: margin.left, x2: margin.left + plotWidth,
        y1: separatorY, y2: separatorY,
      }));
    });

    const tickCount = width &lt; 480 ? 4 : 6;
    for (let tick = 0; tick &lt;= tickCount; tick += 1) {
      const time = windowStart + visibleSpan * tick / tickCount;
      const tickX = x(time);
      svg.append(svgNode(&#x27;line&#x27;, {
        class: &#x27;apv-grid-line&#x27;, x1: tickX, x2: tickX, y1: plotTop, y2: plotBottom,
      }));
      svg.append(svgNode(&#x27;text&#x27;, {
        class: &#x27;apv-axis-text&#x27;, x: tickX, y: plotBottom + 18,
        &#x27;text-anchor&#x27;: tick === 0 ? &#x27;start&#x27; : tick === tickCount ? &#x27;end&#x27; : &#x27;middle&#x27;,
      }, `${time.toFixed(0)} ms`));
    }
    svg.append(svgNode(&#x27;rect&#x27;, {
      class: &#x27;apv-frame&#x27;, &#x27;data-chart-frame&#x27;: &#x27;&#x27;, x: margin.left, y: plotTop,
      width: plotWidth, height: plotBottom - plotTop,
    }));
    svg.append(svgNode(&#x27;text&#x27;, {
      class: &#x27;apv-axis-title&#x27;, &#x27;data-axis&#x27;: &#x27;x&#x27;, x: margin.left + plotWidth / 2,
      y: height - 3, &#x27;text-anchor&#x27;: &#x27;middle&#x27;,
    }, &#x27;相对时间（ms）&#x27;));

    const linkLayer = svgNode(&#x27;g&#x27;, {
      &#x27;aria-hidden&#x27;: &#x27;true&#x27;, &#x27;clip-path&#x27;: &#x27;url(#apv-plot-clip)&#x27;,
    });
    svg.append(linkLayer);
    const barLayer = svgNode(&#x27;g&#x27;, { &#x27;clip-path&#x27;: &#x27;url(#apv-plot-clip)&#x27; });
    svg.append(barLayer);

    function drawSegment(segment, laneIndex, resource) {
      if (segment.end &lt;= windowStart || segment.start &gt;= windowEnd) return;
      const visibleStart = Math.max(segment.start, windowStart);
      const visibleEnd = Math.min(segment.end, windowEnd);
      const startX = x(visibleStart);
      const endX = x(visibleEnd);
      const rectWidth = Math.max(1.5, endX - startX);
      const y = laneYs[laneIndex] + 2;
      const classes = [
        &#x27;apv-segment&#x27;, `apv-segment-${segment.type}`, `apv-stage-${segment.stage}`,
      ];
      if (segment.type === &#x27;attn&#x27; &amp;&amp; segment.attentionType) {
        classes.push(`apv-segment-attn-${segment.attentionType.toLowerCase()}`);
      }
      if (segment.jobKey === selectedJobKey) classes.push(&#x27;is-selected&#x27;);
      const fitTooltip = segment.type === &#x27;attn&#x27;
        ? ` · profiling 拟合输入：${segment.attentionType} / 每请求长度${segment.includeAttentionSetup ? &#x27; / 含首次 Metadata setup&#x27; : &#x27;&#x27;}`
        : segment.type === &#x27;ffn&#x27;
          ? ` · profiling 拟合输入：ubatch q ${fmtTokens(segment.stageData.tokens)} / 复用大 EP FFN`
          : [&#x27;dispatch&#x27;, &#x27;recv&#x27;, &#x27;send&#x27;, &#x27;combine&#x27;].includes(segment.type)
            ? &#x27; · A↔F 通信原估算&#x27;
            : &#x27;&#x27;;
      const rect = svgNode(&#x27;rect&#x27;, {
        class: classes.join(&#x27; &#x27;), x: startX, y, width: rectWidth, height: barHeight,
        rx: 2, &#x27;data-tooltip&#x27;: `${tooltipFor(segment, resource)}${fitTooltip}`,
      });
      rect.addEventListener(&#x27;mouseenter&#x27;, () =&gt; {
        if (selectedJobKey !== segment.jobKey) {
          selectedJobKey = segment.jobKey;
          render();
        }
      });
      barLayer.append(rect);
      const label = segmentLabel(segment, rectWidth);
      if (label) {
        barLayer.append(svgNode(&#x27;text&#x27;, {
          class: &#x27;apv-bar-label&#x27;, x: startX + rectWidth / 2, y: y + 13,
          &#x27;text-anchor&#x27;: &#x27;middle&#x27;,
        }, label));
      }
    }

    simulation.attentionSegments.forEach(segment =&gt; {
      const laneBase = segment.dp * TOPOLOGIES.async.tp;
      for (let tp = 0; tp &lt; TOPOLOGIES.async.tp; tp += 1) {
        drawSegment(segment, laneBase + tp, `A-DP${segment.dp}/TP${tp}`);
      }
    });
    simulation.ffnSegments.forEach(segment =&gt; {
      for (let ep = 0; ep &lt; TOPOLOGIES.async.ep; ep += 1) {
        drawSegment(segment, attentionLaneCount + ep, `FFN/EP${ep}`);
      }
    });

    const selectedJob = selectedJobKey ? simulation.jobs.get(selectedJobKey) : null;
    if (selectedJob) {
      const dpLaneStart = selectedJob.dp * TOPOLOGIES.async.tp;
      const dpMidY = (
        laneYs[dpLaneStart] + laneYs[dpLaneStart + TOPOLOGIES.async.tp - 1]
      ) / 2 + 11;
      const ffnMidY = (laneYs[attentionLaneCount] + laneYs[totalLaneCount - 1]) / 2 + 11;
      const dispatchX = x(selectedJob.dispatchEnd);
      const recvX = x(selectedJob.recvStart);
      const sendX = x(selectedJob.end);
      const combineX = x(selectedJob.combineStart ?? selectedJob.end);
      const selectedEnd = selectedJob.combineEnd ?? selectedJob.end;
      if (selectedEnd &gt; windowStart &amp;&amp; selectedJob.dispatchStart &lt; windowEnd) {
        const firstPath = `M${dispatchX},${dpMidY} C${dispatchX + 10},${dpMidY} ${recvX - 10},${ffnMidY} ${recvX},${ffnMidY}`;
        const secondPath = `M${sendX},${ffnMidY} C${sendX + 10},${ffnMidY} ${combineX - 10},${dpMidY} ${combineX},${dpMidY}`;
        linkLayer.append(svgNode(&#x27;path&#x27;, { class: &#x27;apv-flow-link&#x27;, d: firstPath, &#x27;marker-end&#x27;: &#x27;url(#apv-arrow)&#x27; }));
        linkLayer.append(svgNode(&#x27;path&#x27;, { class: &#x27;apv-flow-link&#x27;, d: secondPath, &#x27;marker-end&#x27;: &#x27;url(#apv-arrow)&#x27; }));
      }
      detail.textContent = `选中：DP${selectedJob.dp} · U${selectedJob.stage} · L${selectedJob.layer} (${MODEL_ATTENTION_SCHEDULE[selectedJob.layer]}) · ${selectedJob.stageData.requestLabel} · ${fmtTokens(selectedJob.stageData.tokens)} tokens · dispatch ${selectedJob.dispatchStart.toFixed(2)} → FFN ${selectedJob.recvStart.toFixed(2)}–${selectedJob.end.toFixed(2)} → combine ${(selectedJob.combineStart ?? selectedJob.end).toFixed(2)} ms`;
    } else {
      detail.textContent = &#x27;当前没有可展示的 FFN 工作项。&#x27;;
    }
    const synchronousWidth = Math.max(320, Math.floor(
      syncChartWrap.getBoundingClientRect().width || measuredWidth,
    ));
    renderSynchronous(synchronousSimulation, synchronousWidth, zoom, panFraction);
  }

  countInput.addEventListener(&#x27;input&#x27;, () =&gt; {
    buildRequestEditor();
    render();
  });
  splitInput.addEventListener(&#x27;change&#x27;, render);
  layerInput.addEventListener(&#x27;input&#x27;, render);
  zoomInput.addEventListener(&#x27;input&#x27;, render);
  panInput.addEventListener(&#x27;input&#x27;, render);

  buildRequestEditor();
  render();

  const resizeObserver = new ResizeObserver(() =&gt; render());
  resizeObserver.observe(chartWrap);
  resizeObserver.observe(syncChartWrap);
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
